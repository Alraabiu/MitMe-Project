<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B24A8"/>
      <stop offset="1" stop-color="#4B67E0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE7FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle grid pattern (depth) -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="2">
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>

  <!-- The "M" mark — two dots connected -->
  <g>
    <!-- Left dot -->
    <circle cx="316" cy="340" r="86" fill="url(#accent)"/>
    <!-- Right dot -->
    <circle cx="708" cy="340" r="86" fill="url(#accent)"/>

    <!-- Left stroke down -->
    <rect x="286" y="340" width="60" height="380" rx="30" fill="url(#accent)"/>
    <!-- Right stroke down -->
    <rect x="678" y="340" width="60" height="380" rx="30" fill="url(#accent)"/>

    <!-- Center V of the M -->
    <path d="M 316 400 L 512 660 L 708 400"
          stroke="url(#accent)"
          stroke-width="60"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Small accent dot (bottom-right corner) -->
  <circle cx="850" cy="850" r="34" fill="#F5C542" opacity="0.9"/>
</svg>
